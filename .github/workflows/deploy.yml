name: Deploy contract-qa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-contract-qa
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/launchthatbrand

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn -B test

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        id: tags
        run: echo "image=${REGISTRY}/contract-qa:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}
            ${{ env.REGISTRY }}/contract-qa:latest

  deploy:
    name: Roll k3s Deployment
    needs: build
    runs-on: [self-hosted, linux, x64, env:launchthat]
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      APP_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply manifests
        run: kubectl apply -f deploy/k8s/
      - name: Roll image
        run: |
          set -euo pipefail
          kubectl -n launchthat set image deployment/contract-qa "contract-qa=${APP_IMAGE}"
          kubectl -n launchthat rollout status deployment/contract-qa --timeout=240s
