apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contract-qa
  namespace: launchthat
  labels:
    app: contract-qa
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: contract-qa.apps.onpoint.host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: contract-qa
                port:
                  number: 8080
