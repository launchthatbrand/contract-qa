<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contract Q&amp;A</title>
  <style>
    body { font-family: Georgia, serif; margin: 0; background: #f6f3ee; color: #1c1917; }
    main { max-width: 40rem; margin: 4rem auto; padding: 0 1.25rem; }
    h1 { font-weight: 600; letter-spacing: -0.02em; }
    p { line-height: 1.5; }
    form { display: flex; gap: 0.75rem; align-items: center; margin-top: 1.5rem; }
    button { background: #9a3412; color: white; border: 0; border-radius: 999px; padding: 0.6rem 1rem; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>Contract Q&amp;A</h1>
  <p>Upload one PDF. Questions are answered from that file, and each answer cites the passage it came from.</p>
  <form action="/documents" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept="application/pdf" required>
    <button type="submit">Upload</button>
  </form>
</main>
</body>
</html>
